<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alford Family">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Alford Family</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#0c0c0d;--mut:#6e6e73;--hint:#b2b2b8;--line:rgba(0,0,0,.09);--track:#e7e7e9;--hero-bg:#0c0c0d;--hero-fg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#151517;--ink:#f3f3f5;--mut:#9a9aa0;--hint:#5b5b60;--line:rgba(255,255,255,.12);--track:#2b2b2e;--hero-bg:#fff;--hero-fg:#0c0c0d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
.hd{flex:0 0 auto;background:var(--bg);padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),18px) 11px max(env(safe-area-inset-left),18px);border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.hd-l,.hd-r{flex:1 1 0;min-width:0;display:flex;align-items:center}
.hd-r{justify-content:flex-end}
.hd .bk{font-size:24px;color:var(--ink);cursor:pointer;line-height:1;padding:8px 12px;margin:-8px 0 -8px -8px}
.hd h1{flex:0 1 auto;font-size:19px;font-weight:700;letter-spacing:-.3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rt{font-size:12px;color:var(--hint);text-align:right;line-height:1.2}
.main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.pager{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-snap-align:start;scroll-snap-stop:always}
.detail{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:5;will-change:transform}
.detail.show{transform:translateX(0)}
.wrap{max-width:600px;margin:0 auto;padding:14px max(env(safe-area-inset-right),16px) 24px max(env(safe-area-inset-left),16px)}
.card{background:var(--card);border:.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.hero{background:var(--hero-bg);color:var(--hero-fg);border:none}
.hero{padding:20px 20px 18px}
.hero .lab{font-size:13px;opacity:.6;letter-spacing:.3px}.hero .big{font-size:50px;font-weight:700;letter-spacing:-2px;margin:6px 0 8px;line-height:1}
.hero .meta{font-size:13px;opacity:.75}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--hero-fg) 15%,transparent);margin-top:8px}
.sec{font-size:13px;color:var(--mut);margin:6px 2px 9px;font-weight:500}
.seg2{display:inline-flex;background:var(--track);border-radius:10px;padding:3px}
.seg2 .segb{flex:0 0 auto;padding:7px 17px}
.seg{display:flex;background:var(--track);border-radius:11px;padding:3px;margin-bottom:14px}.segb{flex:1;text-align:center;font-size:14px;padding:8px 0;border-radius:9px;color:var(--mut);cursor:pointer;transition:.12s}.segb.on{background:var(--card);color:var(--ink);font-weight:600}
.segsm{padding:2px}
.segsm .segb{font-size:12px;padding:5px 11px;border-radius:7px}
.trend{display:flex;gap:7px;align-items:flex-end;height:130px;padding-top:18px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.tbar{width:74%;max-width:30px;border-radius:4px 4px 0 0;min-height:3px;transition:.2s;background:var(--hint)}
.tcol.on .tbar{background:var(--ink)}
.tv{font-size:10px;color:var(--mut);margin-bottom:4px;font-weight:400}.tl{font-size:11px;color:var(--mut);margin-top:6px;white-space:nowrap}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.dot{width:9px;height:9px;border-radius:2px;flex:none;background:var(--ink)}
.ck{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--hint);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--bg);flex:none;cursor:pointer;position:relative}.ck::after{content:'';position:absolute;inset:-10px}.ck.on{background:var(--ink);border-color:var(--ink)}
.row .nm{flex:1;min-width:0}.row .t1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--mut);margin-top:1px}
.row .amt{font-size:15px;font-weight:400;white-space:nowrap}.amt.neg{color:var(--mut)}
.row .pct{font-size:12px;color:var(--mut);width:40px;text-align:right;flex:none}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:8px}.fill{height:6px;border-radius:3px;background:var(--ink)}
.catrow{padding:13px 0;border-bottom:.5px solid var(--line);cursor:pointer}.catrow:last-child{border:0}
.catrow .top{display:flex;align-items:center;gap:9px}.catrow .top .nm{flex:1;font-size:15px;font-weight:500}
.tx{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}.tx:last-child{border:0}
.tx .d{font-size:12px;color:var(--mut);width:42px;flex:none}
.amt,.tx .a,.tx .d,.row .pct,.tv{font-variant-numeric:tabular-nums}
.tx .n{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .cc{font-size:11px;color:var(--mut);flex:none}
.tx .a{font-size:14px;font-weight:400;flex:none}.tx .a.neg{color:var(--mut)}
.ins{font-size:14px;color:var(--ink);line-height:1.55;padding:7px 0;border-bottom:.5px solid var(--line);display:flex;gap:8px}.ins:last-child{border:0}
.ins b{color:var(--ink);font-weight:700}
.empty{text-align:center;color:var(--hint);font-size:14px;padding:40px 0}
.rftbl{overflow-x:auto;margin:2px 0 8px}
.rftbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.rftbl th{color:var(--mut);font-size:11px;font-weight:600;text-align:left;padding:5px 0;border-bottom:.5px solid var(--line)}
.rftbl td{padding:6px 0;border-bottom:.5px solid var(--line);color:var(--ink)}
.rftbl a{color:var(--mut);font-weight:500;text-decoration:none;font-size:12px;border:0}
.rftbl .data{background:none;padding:0;font-size:13px}
.rftbl td:last-child,.rftbl th:last-child{text-align:right}
.rftbl td:nth-child(3),.rftbl th:nth-child(3){text-align:right}
.bcard{padding:2px 16px}
.br{display:grid;grid-template-columns:20px minmax(0,1fr) 38px auto 20px;align-items:center;column-gap:8px;min-height:48px;border-bottom:.5px solid var(--line);font-size:15px;font-weight:400;font-variant-numeric:tabular-nums}
.bd{color:var(--mut);text-align:right}.bn{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{color:var(--mut);font-size:13px;text-align:right;white-space:nowrap}.ba{color:var(--ink)}
.bc{display:flex;justify-content:center}.bchk{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.btot{border-bottom:0;border-top:1px solid var(--ink);margin-top:-.5px}
.bnote{text-align:center;color:var(--hint);font-size:12px;margin:0 0 16px}
.acc{display:inline-flex;justify-content:space-between;gap:4px;font-variant-numeric:tabular-nums;font-weight:400}.acc.neg{color:var(--mut)}
.tx .acc{width:86px}
.tcol.part .tbar{background:repeating-linear-gradient(135deg,var(--hint) 0 3px,transparent 3px 6px)}.tcol.part.on .tbar{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.asof{color:var(--hint);font-weight:400}
.tcol.tnone{cursor:default}
/* 2026-11-06 老板令:年份去箭头、居中;左右滑要有过渡。做法 = 三格滑轨(前一年|今年|后一年),手指拖着走,松手滑到位再换数据 */
.trwin{overflow:hidden;touch-action:pan-y;margin:0 -18px;-webkit-user-select:none;user-select:none}
.trtrack{display:flex;transform:translateX(-100%);will-change:transform}
.trpanel{flex:0 0 100%;min-width:0;padding:0 18px}
.sec.yr{text-align:center;margin:4px 0 0}
.tnote{font-size:12px;color:var(--mut);text-align:center;margin:10px 0 2px}
/* 底部 dock（2026-08-09 之八十九 用户指令恢复；之四十三曾删除，之四十二安全区教训已沿用） */
</style></head><body>

function _cx(){var now=new Date(),ty=now.getFullYear(),tm=now.getMonth(),td=now.getDate();return {ty:ty,tm:tm,td:td,base:new Date(ty,tm,td),cy:ty+'-'+('0'+(tm+1)).slice(-2),pm:paidMap()};}
function _row(C,name,day,right,sub,until){var pm=C.pm,ty=C.ty,tm=C.tm,cy=C.cy;var md2=function(d){return (d.getMonth()+1)+'/'+d.getDate();},ymd=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);};var paid=pm[name]===cy,dt=new Date(ty,paid?tm+1:tm,day),days=Math.round((dt-C.base)/86400000),cym=ymd(dt);var when=paid?((until&&cym>until)?'已还清 🎉':'已还本月 · 下次 '+md2(dt)):(days<0?'本月 '+day+' 号已过':(days===0?'今天到期':'还有 '+days+' 天'));var soon=!paid&&days<=3,nm=name.replace(/'/g,'');return {date:dt,html:'<div class="row" style="cursor:default'+(paid?';opacity:.5':'')+'"><span class="ck'+(paid?' on':'')+'" onclick="togglePaid(\''+nm+'\')">'+(paid?'✓':'')+'</span><div class="nm"><div class="t1"'+(paid?' style="text-decoration:line-through"':'')+'>'+name+'</div><div class="t2">每月 '+day+' 号'+(sub?' · '+sub:'')+'</div></div><div style="text-align:right;flex:none"><div class="amt">'+right+'</div><div class="t2" style="'+(soon?'color:var(--ink);font-weight:700':'')+'">'+when+'</div></div></div>'};}

var SHOW_DEBTS=false;
function debtHTML(){if(!SHOW_DEBTS)return calHTML();var C=_cx(),ty=C.ty,tm=C.tm,cy=C.cy,pm=C.pm;var fcny=function(n){return '¥'+Math.round(n).toLocaleString('en-US');},uM=function(ym){return (+ym.slice(5,7))+'月';};var out='';var debts=(D.debts||[]).filter(function(x){return x.until>=cy&&!x.prepaid;});var cleared=(D.debts||[]).filter(function(x){return x.until<cy||x.prepaid;}).sort(function(a,b){var ka=a.prepaid||a.until,kb=b.prepaid||b.until;return ka<kb?-1:ka>kb?1:0;});var clearedCard=cleared.length?'<div class="card"><div class="sec">已上岸 '+cleared.length+' 笔 🎉</div>'+cleared.map(function(x){return '<div class="row" style="opacity:.55"><div class="nm"><div class="t1" style="text-decoration:line-through">'+x.name+'</div></div><div class="t2">'+(x.prepaid?uM(x.prepaid)+'提前还清 🎉':uM(x.until)+'还清')+'</div></div>';}).join('')+'</div>':'';if(debts.length){var rd=debts.map(function(x){return _row(C,x.name,x.day,fcny(x.amount),uM(x.until)+'还清',x.until);}).sort(function(a,b){return a.date-b.date;});var dueThis=debts.reduce(function(s,x){return s+(pm[x.name]===cy?0:x.amount);},0),paidN=debts.filter(function(x){return pm[x.name]===cy;}).length;var lastYM=debts.map(function(x){return x.until;}).sort().slice(-1)[0];var nLeft=(+lastYM.slice(0,4)-ty)*12+(+lastYM.slice(5,7)-1-tm);var allDone=paidN===debts.length;var totRemain=debts.reduce(function(s,x){var uy=+x.until.slice(0,4),um=+x.until.slice(5,7),ml=(uy-ty)*12+(um-(tm+1))+1;if(pm[x.name]===cy)ml-=1;return s+x.amount*Math.max(ml,0);},0);var nextDay=Math.min.apply(null,debts.map(function(x){return x.day;}));out+='<div class="card hero"><div class="lab">'+(allDone?'这个月债务':'这个月还要还')+'</div><div class="big">'+(allDone?'都还完了 ✓':fcny(dueThis))+'</div><div class="meta">总共还欠 约'+fcny(totRemain)+(allDone&&nextDay?' · 下月 '+nextDay+' 号再开始':'')+'</div><span class="chip">'+(paidN?'点掉 '+paidN+'/'+debts.length+' 笔 · ':'共 '+debts.length+' 笔 · ')+'还有 '+nLeft+' 个月上岸</span></div>'+clearedCard+'<div class="card"><div class="sec">还了就点左边圆圈 → 自动跳下月（按到  // 2026-11-05 老板令:Bills 像 Excel 一样的表格;最后只留「✓ + 扣款日」,日期不挤在对勾旁边;金额会计格式。

 }).join('');
 var mo=D.billmonth?(+D.billmonth.slice(5,7))+'月':'';   // 2026-11-06:表头写明是几月的账
 return '<div class="card bcard">'+(mo?'<div class="sec yr" style="margin:12px 0 2px">'+mo+'</div>':'')+rows+'<div class="br btot"><div class="bd"></div><div class="bn">合计</div><div class="bp"></div><div class="ba">'+acc(tot,2,w)+'</div><div class="bc"></div></div></div>'

}

function updateHeader(){let bk=document.getElementById('bk'),tt=document.getElementById('ttl'),rt=document.getElementById('rt');if(stack.length){bk.style.display='block';tt.textContent=stack[stack.length-1].title;rt.innerHTML='';}else{bk.style.display='none';tt.textContent=(TABS[tabIndex(tab)]||[0,'ALL'])[1];rt.innerHTML=(tab==='ov')?('更新 '+D.generated+(ENC?' · <span onclick="lock()" style="cursor:pointer;display:inline-block;padding:10px;margin:-10px">🔒</span>':'')):'';}}
function mountApp(){let main=document.getElementById('main');main.innerHTML='<div class="pager" id="pager">'+TABS.map(t=>'<section class="page"><div class="wrap">'+ROOT[t[0]]()+'</div></section>').join('')+'</div><div class="detail" id="detail"></div>';let pager=document.getElementById('pager');pager.scrollLeft=tabIndex(tab)*pager.clientWidth;let raf=0;pager.addEventListener('scroll',function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;let i=Math.round(pager.scrollLeft/Math.max(pager.clientWidth,1));if(TABS[i])setActive(TABS[i][0]);});},{passive:true});window.addEventListener('resize',function(){pager.scrollLeft=tabIndex(tab)*pager.clientWidth;});let dt=document.getElementById('detail'),dsx=0,dsy=0;dt.addEventListener('touchstart',function(e){let t=e.changedTouches[0];dsx=t.clientX;dsy=t.clientY;},{passive:true});dt.addEventListener('touchend',function(e){let t=e.changedTouches[0],dx=t.clientX-dsx,dy=t.clientY-dsy;if(dx>60&&dx>Math.abs(dy)*1.6&&stack.length)back();},{passive:true});updateHeader();}

function txRow(t){return `<div class="tx"><span class="d">${md(t.d)}</span><span class="n">${esc(t.n)}</span><span class="cc">${t.s||t.c}</span><span class="a">${acc(t.a,2)}</span></div>`}
function catTable(entries,total,onclick){let w=accw(entries.map(e=>e[1]),0);return entries.map(([c,v])=>{let p=total?Math.round(v/total*100):0;return `<div class="catrow" onclick="${onclick(c)}"><div class="top"><span class="dot" style="background:${col(c)}"></span><span class="nm">${c}</span><span class="pct">${p}%</span><span class="amt">${acc(v,0,w)}</span></div><div class="bar"><div class="fill" style="width:${Math.max(p,2)}%;background:${col(c)}"></div></div></div>`}).join('')}
// 2026-11-05 老板令:趋势图固定 1–12 月(还没到/没数据的月份空着),标题 = 年份;在图上左右滑动切年份(往左=后一年,往右=前一年)。
// 年份跟着「选中的月份」走:切年 = 选中那一年最后一个有数的月份,下面「花在哪」一起换。
function yearsList(){return [...new Set(months.map(m=>m.slice(0,4)))].sort();}
window.setYear=function(y){let ms=months.filter(m=>m.slice(0,4)===y);if(ms.length){selMonth=ms[ms.length-1];rerenderPage('ov');}};
function lastOf(y){let ms=months.filter(m=>m.slice(0,4)===y);return ms[ms.length-1]||null;}
function trendBars(yr,active){let slots=[...Array(12)].map((_,k)=>yr+'-'+String(k+1).padStart(2,'0'));let have=slots.filter(m=>months.includes(m));let mx=Math.max(...have.map(m=>Math.abs(mData(m).net)),1);return `<div class="trend">`+slots.map(m=>{if(!months.includes(m))return `<div class="tcol tnone"><span class="tv">&nbsp;</span><div class="tbar" style="height:0;min-height:0"></div><span class="tl">${(+m.slice(5,7))+'月'}</span></div>`;let nt=mData(m).net,h=Math.max(Math.abs(nt)/mx*100,3);return `<div class="tcol ${m===active?'on':''}${m===D.partial?' part':''}" onclick="setSelMonth('${m}')"><span class="tv">${Math.abs(nt)>=1000?Math.round(Math.abs(nt)/1000)+'k':Math.round(Math.abs(nt))}</span><div class="tbar" style="height:${h}%"></div><span class="tl">${(+m.slice(5,7))+'月'}</span></div>`}).join('')+`</div>`}
// 2026-11-06 老板令「去掉箭头、年份居中;滑动像卡壳、没有过渡」→ 三格滑轨:前一年 | 今年 | 后一年,每格自带居中的年份。
// 手指拖着整格走(没有隔壁年份就只拖得动三分之一,像橡皮筋);松手过线(或甩得快)就滑到隔壁那格,滑到位再换下面的数据——换完画面一样,不跳。
function trend(active){let yr=active.slice(0,4),ys=yearsList(),i=ys.indexOf(yr),py=i>0?ys[i-1]:null,ny=(i>=0&&i<ys.length-1)?ys[i+1]:null;window._trYr=yr;const pane=(y,a)=>`<div class="trpanel">${y?`<div class="sec yr">${y}</div>`+trendBars(y,a):''}</div>`;return `<div class="trwin" onpointerdown="trD(event)" onpointermove="trM(event)" onpointerup="trU(event)" onpointercancel="trC(event)"><div class="trtrack">`+pane(py,py&&lastOf(py))+pane(yr,active)+pane(ny,ny&&lastOf(ny))+`</div></div>`}
let _tr=null;
window.trD=function(e){if(e.pointerType==='mouse'&&e.button!==0)return;let w=e.currentTarget;_tr={x:e.clientX,y:e.clientY,t:Date.now(),w:w.clientWidth||1,el:w,tk:w.querySelector('.trtrack'),lock:null,dx:0,id:e.pointerId};};
window.trM=function(e){if(!_tr||e.pointerId!==_tr.id)return;let dx=e.clientX-_tr.x,dy=e.clientY-_tr.y;if(!_tr.lock){if(Math.abs(dx)<7&&Math.abs(dy)<7)return;_tr.lock=Math.abs(dx)>Math.abs(dy)?'h':'v';if(_tr.lock==='h'){_tr.tk.style.transition='none';try{_tr.el.setPointerCapture(e.pointerId)}catch(_){}}}if(_tr.lock!=='h')return;let ys=yearsList(),i=ys.indexOf(window._trYr),can=dx<0?i<ys.length-1:i>0;_tr.dx=dx;_tr.tk.style.transform='translateX(calc(-100% + '+(can?dx:dx/3)+'px))';};
window.trU=function(e){if(!_tr||e.pointerId!==_tr.id)return;let s=_tr;_tr=null;if(s.lock!=='h')return;window._trMoved=true;setTimeout(()=>{window._trMoved=false},400);let dx=s.dx,v=dx/Math.max(Date.now()-s.t,1),ys=yearsList(),i=ys.indexOf(window._trYr),dir=0;if((dx<-s.w*.2||(v<-.4&&dx<-20))&&i<ys.length-1)dir=1;else if((dx>s.w*.2||(v>.4&&dx>20))&&i>0)dir=-1;s.tk.style.transition='transform .34s cubic-bezier(.22,.8,.24,1)';s.tk.style.transform='translateX('+(dir>0?'-200%':dir<0?'0%':'-100%')+')';if(dir){let y=ys[i+dir],done=false;const fin=()=>{if(done)return;done=true;setYear(y);};s.tk.addEventListener('transitionend',fin,{once:true});setTimeout(fin,420);}};
window.trC=function(e){if(!_tr)return;let s=_tr;_tr=null;if(s.lock==='h'){s.tk.style.transition='transform .25s ease';s.tk.style.transform='translateX(-100%)';}};

// 「花在哪」卡加[分类|商家]切换——商家视角是原明细页唯一独有的东西,搬过来;其余都是复读,删。
function ovHTML(){
 let cur=(selMonth&&selMonth!=='all')?selMonth:months[months.length-1];
 let pi=months.indexOf(cur),pv=pi>0?months[pi-1]:null;
 let c=mData(cur),p=pv?mData(pv):null;
 let cats=agg(c.L);
 let synR=c.L.filter(t=>t.s==='非BofA').reduce((s,t)=>s+t.a,0);
 let seg=detView==='me'?'me':'ca';
 let toggle='<span class="seg2 segsm">'+[['ca','分类'],['me','商家']].map(x=>'<span class="segb'+(x[0]===seg?' on':'')+'" onclick="setDetView(\''+x[0]+'\')">'+x[1]+'</span>').join('')+'</span>';
 let body=seg==='me'?merRows(c.L):catTable(cats,c.net+c.refund,x=>`openMC('${cur}','${x}')`);
 // 2026-08-16 老板令:彻底不要大数字,只留柱子。房租口径说明保留为一行小字(只在该月有非BofA款时出现)。
 let note=synR>0?`<div class="tnote">${mlab(cur)}含别的卡付的房租 ${f0(synR)}</div>`:'';   // 2026-11-06:原来那行字号没设、显示成大黑字,改成一行小灰字
 return `<div class="card">${trend(cur)}${note}</div>`+
  `<div class="card"><div class="sec" style="display:flex;align-items:center;justify-content:space-between"><span>${mlab(cur)} 花在哪${cur===D.partial?'<span class="asof"> · 到 '+D.asof+'</span>':''}</span>${toggle}</div>${body}</div>`+
  `<div style="text-align:center;color:var(--hint);font-size:12px;margin:4px 2px 2px">每天早上自动更新${D.bankasof?' · 银行数据到 '+D.bankasof:''}</div>`;
}
function monthDetail(m){
 let d=mData(m),cats=agg(d.L);
 let big=d.L.filter(t=>t.a>0).sort((a,b)=>b.a-a.a)[0];
 let ins=[];if(cats[0])ins.push(`<div class="ins">·&nbsp;<div><b>${cats[0][0]}</b> 是大头，占 ${Math.round(cats[0][1]/(d.net+d.refund)*100)}%（${f0(cats[0][1])}）</div></div>`);
 if(big&&big.a>=300)ins.push(`<div class="ins">·&nbsp;<div>最大一笔：${esc(big.n)} <b>${f0(big.a)}</b></div></div>`);
 if(d.refund>0)ins.push(`<div class="ins">·&nbsp;<div>退款拿回 <b>${f0(d.refund)}</b>，已自动冲抵</div></div>`);
 return `<div class="card hero"><div class="lab">${mlab(m)}</div><div class="big">${f0(d.net)}</div></div>`+
  `<div class="card"><div class="sec">花在哪（点分类看每一笔）</div>${catTable(cats,d.net+d.refund,c=>`openMC('${m}','${c}')`)}</div>`+
  (ins.length?`<div class="card"><div class="sec">这个月值得知道</div>${ins.join('')}</div>`:'');
}
function mcDetail(m,c){let L=TX.filter(t=>ym(t.d)===m&&t.c===c);let tot=L.reduce((s,t)=>s+t.a,0);return `<div class="card"><div class="sec"><span class="dot" style="background:${col(c)};display:inline-block;margin-right:6px"></span>${mlab(m)} · ${c} 合计 ${f0(tot)}（${L.length} 笔）</div>${L.map(txRow).join('')}</div>`}
function catDetail(c){
 let L=TX.filter(t=>t.c===c),tot=L.reduce((s,t)=>s+t.a,0);
 let bym={};months.forEach(m=>bym[m]=0);L.forEach(t=>bym[ym(t.d)]+=t.a);
 let mx=Math.max(...Object.values(bym).map(Math.abs),1);
 let tr=`<div class="trend">`+months.map(m=>`<div class="tcol" onclick="openMC('${m}','${c}')"><span class="tv">${bym[m]?Math.round(bym[m])>=1000?Math.round(bym[m]/1000)+'k':Math.round(bym[m]):''}</span><div class="tbar" style="height:${Math.max(Math.abs(bym[m])/mx*100,3)}%"></div><span class="tl">${(+m.slice(5,7))+'月'}</span></div>`).join('')+`</div>`;
 return `<div class="card hero" style="background:${col(c)}"><div class="lab">${c} · 累计</div><div class="big">${f0(tot)}</div><span class="chip">${L.length} 笔 · 月均 ${f0(tot/months.length)}</span></div>`+
  `<div class="card"><div class="sec">每月趋势</div>${tr}</div>`+
  `<div class="card"><div class="sec">全部明细</div>${L.map(txRow).join('')}</div>`;
}
function merRows(list){var o={};list.forEach(function(t){var k=t.n.replace(/\(.*\)/,'').trim();if(!o[k])o[k]=[0,0];o[k][0]+=t.a;o[k][1]++;});var e=Object.entries(o).sort(function(a,b){return b[1][0]-a[1][0];}).slice(0,40),w=accw(e.map(function(x){return x[1][0];}),0);var tot=list.filter(function(t){return t.a>0;}).reduce(function(s,t){return s+t.a;},0);return e.map(function(pair,i){var n=pair[0],v=pair[1];return '<div class="row" data-n="'+esc(n)+'" onclick="openMer(this.dataset.n)"><span class="pct" style="text-align:left;width:24px;color:var(--hint)">'+(i+1)+'</span><div class="nm"><div class="t1">'+esc(n)+'</div><div class="t2">'+v[1]+' 笔</div></div><span class="pct">'+(tot?Math.round(v[0]/tot*100):0)+'%</span><span class="amt">'+acc(v[0],0,w)+'</span></div>';}).join('');}
function merDetail(n){let L=TX.filter(t=>t.n.replace(/\(.*\)/,'').trim()===n);let tot=L.reduce((s,t)=>s+t.a,0);return `<div class="card hero"><div class="lab">${esc(n)} · 累计</div><div class="big">${f0(tot)}</div><span class="chip">${L.length} 笔</span></div><div class="card">${L.map(txRow).join('')}</div>`}

async function decryptData(pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.s),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.i)},key,b(ENC.c));return JSON.parse(new TextDecoder().decode(pt));}
async function applyPw(pw){D=await decryptData(pw);initData();mountApp();}

let SYNCID=null,SYNCKEY=null;
async function syncInit(pw){if(!SYNC_URL)return;try{const te=new TextEncoder();const idBuf=await crypto.subtle.digest('SHA-256',te.encode('mc-sync-id-v1|'+pw));SYNCID=[...new Uint8Array(idBuf)].map(b=>b.toString(16).padStart(2,'0')).join('');const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);SYNCKEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('mc-sync-enc-v1'),iterations:50000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);syncPull();}catch(e){}}
async function syncPull(){if(!SYNCID||!SYNCKEY)return;try{const r=await fetch(SYNC_URL+'/s/'+SYNCID,{cache:'no-store'});if(!r.ok)return;const o=await r.json();if(!o.iv||!o.ct)return;const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.iv)},SYNCKEY,b(o.ct));const d=JSON.parse(new TextDecoder().decode(pt));let lts=0;try{lts=+(localStorage.getItem('mc_paid_ts')||0)}catch(e){}if(d.ts>lts){try{localStorage.setItem('mc_paid',JSON.stringify(d.m||{}));localStorage.setItem('mc_paid_ts',String(d.ts))}catch(e){}if(document.getElementById('pager'))rerenderCal();}}catch(e){}}
async function syncPush(){if(!SYNCID||!SYNCKEY)return;try{const ts=Date.now();try{localStorage.setItem('mc_paid_ts',String(ts))}catch(e){}const data=JSON.stringify({m:paidMap(),ts:ts});const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},SYNCKEY,new TextEncoder().encode(data));const b64=a=>btoa(String.fromCharCode.apply(null,new Uint8Array(a)));await fetch(SYNC_URL+'/s/'+SYNCID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({iv:b64(iv),ct:b64(ct)})});}catch(e){}}
