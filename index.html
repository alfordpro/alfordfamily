<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 2026-11-08 老板:iOS 新系统上顶栏(返回箭头/标题/更新时间)整片发糊。根因 = 系统在延伸到状态栏底下的网页 App 顶部画一层毛玻璃(WebKit 317153,苹果:black-translucent 已废弃多版,请删掉);改 default = 状态栏系统画、网页从它下面开始,顶栏就不在毛玻璃底下了。⚠️ 这个值在「添加到主屏幕」那一刻读取,改完要删掉图标重新添加才生效 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alford Family">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Alford Family</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#0c0c0d;--mut:#6e6e73;--hint:#b2b2b8;--line:rgba(0,0,0,.09);--track:#e7e7e9;--hero-bg:#0c0c0d;--hero-fg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#151517;--ink:#f3f3f5;--mut:#9a9aa0;--hint:#5b5b60;--line:rgba(255,255,255,.12);--track:#2b2b2e;--hero-bg:#fff;--hero-fg:#0c0c0d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
.hd{flex:0 0 auto;background:var(--bg);padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),18px) 11px max(env(safe-area-inset-left),18px);border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.hd-l,.hd-r{flex:1 1 0;min-width:0;display:flex;align-items:center}
.hd-r{justify-content:flex-end}
.hd .bk{font-size:24px;color:var(--ink);cursor:pointer;line-height:1;padding:8px 12px;margin:-8px 0 -8px -8px}
.hd h1{flex:0 1 auto;font-size:19px;font-weight:700;letter-spacing:-.3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rt{font-size:12px;color:var(--hint);text-align:right;line-height:1.2}
.main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.pager{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-snap-align:start;scroll-snap-stop:always}
.detail{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:5;will-change:transform}
.detail.show{transform:translateX(0)}
.wrap{max-width:600px;margin:0 auto;padding:14px max(env(safe-area-inset-right),16px) 24px max(env(safe-area-inset-left),16px)}
.card{background:var(--card);border:.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.hero{background:var(--hero-bg);color:var(--hero-fg);border:none}
.hero{padding:20px 20px 18px}
.hero .lab{font-size:13px;opacity:.6;letter-spacing:.3px}.hero .big{font-size:50px;font-weight:700;letter-spacing:-2px;margin:6px 0 8px;line-height:1}
.hero .meta{font-size:13px;opacity:.75}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--hero-fg) 15%,transparent);margin-top:8px}
.sec{font-size:13px;color:var(--mut);margin:6px 2px 9px;font-weight:500}
.seg2{display:inline-flex;background:var(--track);border-radius:10px;padding:3px}
.seg2 .segb{flex:0 0 auto;padding:7px 17px}
.seg{display:flex;background:var(--track);border-radius:11px;padding:3px;margin-bottom:14px}.segb{flex:1;text-align:center;font-size:14px;padding:8px 0;border-radius:9px;color:var(--mut);cursor:pointer;transition:.12s}.segb.on{background:var(--card);color:var(--ink);font-weight:600}
.segsm{padding:2px}
.segsm .segb{font-size:12px;padding:5px 11px;border-radius:7px}
.trend{display:flex;gap:7px;align-items:flex-end;height:130px;padding-top:18px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.tbar{width:74%;max-width:30px;border-radius:4px 4px 0 0;min-height:3px;transition:.2s;background:var(--hint)}
.tcol.on .tbar{background:var(--ink)}
.tv{font-size:10px;color:var(--mut);margin-bottom:4px;font-weight:400}.tl{font-size:11px;color:var(--mut);margin-top:6px;white-space:nowrap}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.dot{width:9px;height:9px;border-radius:2px;flex:none;background:var(--ink)}
.ck{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--hint);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--bg);flex:none;cursor:pointer;position:relative}.ck::after{content:'';position:absolute;inset:-10px}.ck.on{background:var(--ink);border-color:var(--ink)}
.row .nm{flex:1;min-width:0}.row .t1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--mut);margin-top:1px}
.row .amt{font-size:15px;font-weight:400;white-space:nowrap}.amt.neg{color:var(--mut)}
.row .pct{font-size:12px;color:var(--mut);width:40px;text-align:right;flex:none}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:8px}.fill{height:6px;border-radius:3px;background:var(--ink)}
.catrow{padding:13px 0;border-bottom:.5px solid var(--line);cursor:pointer}.catrow:last-child{border:0}
.catrow .top{display:flex;align-items:center;gap:9px}.catrow .top .nm{flex:1;font-size:15px;font-weight:500}
.tx{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}.tx:last-child{border:0}
.tx .d{font-size:12px;color:var(--mut);width:42px;flex:none}
.amt,.tx .a,.tx .d,.row .pct,.tv{font-variant-numeric:tabular-nums}
.tx .n{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .cc{font-size:11px;color:var(--mut);flex:none}
.tx .a{font-size:14px;font-weight:400;flex:none}.tx .a.neg{color:var(--mut)}
.ins{font-size:14px;color:var(--ink);line-height:1.55;padding:7px 0;border-bottom:.5px solid var(--line);display:flex;gap:8px}.ins:last-child{border:0}
.ins b{color:var(--ink);font-weight:700}
.empty{text-align:center;color:var(--hint);font-size:14px;padding:40px 0}
.rftbl{overflow-x:auto;margin:2px 0 8px}
.rftbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.rftbl th{color:var(--mut);font-size:11px;font-weight:600;text-align:left;padding:5px 0;border-bottom:.5px solid var(--line)}
.rftbl td{padding:6px 0;border-bottom:.5px solid var(--line);color:var(--ink)}
.rftbl a{color:var(--mut);font-weight:500;text-decoration:none;font-size:12px;border:0}
.rftbl .data{background:none;padding:0;font-size:13px}
.rftbl td:last-child,.rftbl th:last-child{text-align:right}
.rftbl td:nth-child(3),.rftbl th:nth-child(3){text-align:right}
.bcard{padding:2px 16px}
.br{display:grid;grid-template-columns:20px minmax(0,1fr) 38px auto 20px;align-items:center;column-gap:8px;min-height:48px;border-bottom:.5px solid var(--line);font-size:15px;font-weight:400;font-variant-numeric:tabular-nums}
.bd{color:var(--mut);text-align:right}.bn{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{color:var(--mut);font-size:13px;text-align:right;white-space:nowrap}.ba{color:var(--ink)}
.bc{display:flex;justify-content:center}.bchk{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.btot{border-bottom:0;border-top:1px solid var(--ink);margin-top:-.5px}
.acc{display:inline-flex;justify-content:space-between;gap:4px;font-variant-numeric:tabular-nums;font-weight:400}.acc.neg{color:var(--mut)}
.tx .acc{width:86px}
.tcol.part .tbar{background:repeating-linear-gradient(135deg,var(--hint) 0 3px,transparent 3px 6px)}.tcol.part.on .tbar{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.asof{color:var(--hint);font-weight:400}
.tcol.tnone{cursor:default}
/* 2026-11-06 老板令:年份去箭头、居中;左右滑要有过渡。做法 = 三格滑轨(前一年|今年|后一年),手指拖着走,松手滑到位再换数据 */
.trwin{overflow:hidden;touch-action:pan-y;margin:0 -18px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.trwin *{touch-action:pan-y}
.trtrack{display:flex;transform:translateX(-100%);will-change:transform}
.trpanel{flex:0 0 100%;min-width:0;padding:0 18px}
.sec.yr{text-align:center;margin:4px 0 0}
.tnote{font-size:12px;color:var(--mut);text-align:center;margin:10px 0 2px}
/* 底部 dock（2026-08-09 之八十九 用户指令恢复；之四十三曾删除，之四十二安全区教训已沿用） */
</style></head><body>

const f0=n=>(n<0?'+$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const f2=n=>(n<0?'+$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=(n,dc)=>Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dc,maximumFractionDigits:dc});
const accw=(list,dc)=>Math.max(...list.map(n=>nf(n,dc).length),1)+1.6;   // 这一列要多宽(ch)
const acc=(n,dc,w)=>'<span class="acc'+(n<0?' neg':'')+'"'+(w?' style="width:'+w+'ch"':'')+'><span>'+(n<0?'+$':'$')+'</span><span>'+nf(n,dc)+'</span></span>';  // 会计格式:$ 靠左一竖排、数字靠右(老板 11-05)
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=c=>'var(--ink)';
const ym=d=>d.slice(0,7);
const mlab=m=>{let y=m.slice(0,4),o=+m.slice(5,7);return y===String(new Date().getFullYear())?o+'月':y.slice(2)+'年'+o+'月'};
const md=d=>(+d.slice(5,7))+'/'+(+d.slice(8,10));
function agg(list){let o={};list.forEach(t=>{if(t.a>0)o[t.c]=(o[t.c]||0)+t.a});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function mData(m){let L=TX.filter(t=>ym(t.d)===m);return{L,net:L.reduce((s,t)=>s+t.a,0),refund:L.filter(t=>t.a<0).reduce((s,t)=>s-t.a,0),n:L.length}}
function initData(){TX=D.tx;months=[...new Set(TX.map(t=>ym(t.d)))].sort();}

let tab='ov',stack=[],selMonth=null,detView='ca';
window.setSelMonth=function(m){if(window._trMoved)return;selMonth=m;rerenderPage('ov');};

async function decryptData(pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.s),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.i)},key,b(ENC.c));return JSON.parse(new TextDecoder().decode(pt));}
async function applyPw(pw){D=await decryptData(pw);initData();mountApp();}

const SYNC_URL='';  // 2026-11-05 Cloudflare 退役:两台手机打勾同步停用(打勾入口早已拿掉)
let SYNCID=null,SYNCKEY=null;
async function syncInit(pw){if(!SYNC_URL)return;try{const te=new TextEncoder();const idBuf=await crypto.subtle.digest('SHA-256',te.encode('mc-sync-id-v1|'+pw));SYNCID=[...new Uint8Array(idBuf)].map(b=>b.toString(16).padStart(2,'0')).join('');const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);SYNCKEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('mc-sync-enc-v1'),iterations:50000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);syncPull();}catch(e){}}
async function syncPull(){if(!SYNCID||!SYNCKEY)return;try{const r=await fetch(SYNC_URL+'/s/'+SYNCID,{cache:'no-store'});if(!r.ok)return;const o=await r.json();if(!o.iv||!o.ct)return;const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.iv)},SYNCKEY,b(o.ct));const d=JSON.parse(new TextDecoder().decode(pt));let lts=0;try{lts=+(localStorage.getItem('mc_paid_ts')||0)}catch(e){}if(d.ts>lts){try{localStorage.setItem('mc_paid',JSON.stringify(d.m||{}));localStorage.setItem('mc_paid_ts',String(d.ts))}catch(e){}if(document.getElementById('pager'))rerenderCal();}}catch(e){}}
async function syncPush(){if(!SYNCID||!SYNCKEY)return;try{const ts=Date.now();try{localStorage.setItem('mc_paid_ts',String(ts))}catch(e){}const data=JSON.stringify({m:paidMap(),ts:ts});const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},SYNCKEY,new TextEncoder().encode(data));const b64=a=>btoa(String.fromCharCode.apply(null,new Uint8Array(a)));await fetch(SYNC_URL+'/s/'+SYNCID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({iv:b64(iv),ct:b64(ct)})});}catch(e){}}
